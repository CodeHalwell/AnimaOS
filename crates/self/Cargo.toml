[package]
# The conceptual `self` crate. Package name uses the `anima-self` prefix because
# `self` is a reserved Rust keyword and cannot be imported directly. Code refers
# to the crate as `anima_self`; docs refer to it conceptually as `self`.
name = "anima-self"
version.workspace = true
edition.workspace = true
license.workspace = true

# E4.5: anima-self is already fully no_std-clean (uses only core::marker::PhantomData).
# The std feature is included for consistency with other crates in this workspace.
[features]
default = ["std"]
std = []

[lib]
name = "anima_self"
path = "src/lib.rs"
