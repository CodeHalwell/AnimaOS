[package]
name = "corpus"
version.workspace = true
edition.workspace = true
license.workspace = true

# Declare `kani` as a known cfg so that `#[cfg(kani)]` proof harnesses
# (Epic E4.6) do not trigger the `unexpected_cfgs` lint in normal builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
