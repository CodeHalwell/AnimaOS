[package]
name = "senses"
version.workspace = true
edition.workspace = true
license.workspace = true

# The full crate — including SensoryBridge — compiles for no_std targets:
# Arc/VecDeque come from alloc and the lock comes from the spin-backed shim
# in src/sync.rs. The std feature switches the shim to std::sync::Mutex.
[features]
default = ["std"]
std = []

[dependencies]
# no_std lock backing for the sync shim (std builds use std::sync::Mutex and
# never touch this — see src/sync.rs). mutex-only, no default features.
spin = { version = "0.12.1", default-features = false, features = ["mutex", "spin_mutex"] }
