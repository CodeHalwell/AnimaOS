[package]
name = "lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "E15 — Operator trust & agent lifecycle: digest, replay, snapshot, approval queue, digital-twin."

[dependencies]
vita = { path = "../vita" }
# E15↔E11 bridge: lifecycle owns the approval queue and routes E11 skill/tool
# proposals into it. `skills` depends only on `praxis` + `serde` (no path to
# `vita`/`lifecycle`), so this edge is acyclic — verified via `cargo metadata`.
skills = { path = "../skills" }
# E15↔E8 bridge: routes a sleep-phase adapter that cleared the finetune
# adoption gate into the approval queue as a WeightUpdate proposal.
# `anima-finetune` depends only on `serde`/`serde_json` (no path back to
# `vita`/`lifecycle`), so this edge is acyclic.
anima-finetune = { path = "../finetune" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
