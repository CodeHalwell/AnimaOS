[package]
name = "vita"
version.workspace = true
edition.workspace = true
license.workspace = true

# E4.5: vita requires std (Unix socket cortex bridge, file-backed identity/episodic).
# Future work: extract pure sub-modules (gate, router, sleep state machine) into
# a no_std-compatible layer.
[features]
default = ["std"]
std = ["dep:sha2"]

[dependencies]
memory = { path = "../memory" }
interoception = { path = "../interoception" }
scheduler = { path = "../scheduler" }
senses = { path = "../senses" }
kv-controller = { path = "../kv-controller" }
defence = { path = "../defence" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Optional, std-only: HMAC-SHA256 tamper-evidence sidecar for the audit log
# (EX.4 / threat T-8). default-features = false keeps the (future) no_std path
# clean, and the dep is pulled in only by the `std` feature so the microVM
# image budget is never touched.
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
