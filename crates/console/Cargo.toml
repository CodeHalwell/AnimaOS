[package]
name = "console"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Operator console for AnimaOS: an in-process telemetry/guidance bridge and the anima-console client (TUI + serial bridge)."

[[bin]]
name = "anima-console"
path = "src/bin/anima-console.rs"

[dependencies]
console-proto = { path = "../console-proto", features = ["json"] }
senses = { path = "../senses" }
interoception = { path = "../interoception" }
vita = { path = "../vita" }
lifecycle = { path = "../lifecycle" }
# E33 S33.1 — durable conversation history served by `GET /conversation`.
sessions = { path = "../sessions" }
# E33 S33.4 — response feedback collected from the conversation view.
feedback = { path = "../feedback" }
metrics = { path = "../metrics" }
skills = { path = "../skills" }
anima-finetune = { path = "../finetune" }
serde_json = { workspace = true }
