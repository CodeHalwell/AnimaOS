[workspace]
members = [
  "crates/corpus",
  "crates/vita",
  "crates/scheduler",
  "crates/memory",
  "crates/praxis",
  "crates/self",
  "crates/interoception",
  "crates/senses",
  "kernels/hosted",
  "llm-backends",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "20", default-features = true }
