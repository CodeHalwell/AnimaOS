[workspace]
members = [
  "crates/corpus",
  "crates/vita",
  "crates/scheduler",
  "crates/memory",
  "crates/praxis",
  "crates/self",
  "crates/interoception",
  "crates/senses",
  "crates/defence",
  "crates/constitution",
  "crates/kv-controller",
  "crates/console-proto",
  "crates/console",
  "crates/lifecycle",
  "crates/motivation",
  "crates/skills",
  "crates/comms",
  "crates/actuators",
  "crates/finetune",
  "crates/users",
  "crates/analytics",
  "kernels/hosted",
  "llm-backends",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
criterion = { version = "0.8", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "45", default-features = true }
