[workspace]
members = [
  "crates/corpus",
  "crates/vita",
  "crates/scheduler",
  "crates/memory",
  "crates/praxis",
  "crates/self",
  "crates/interoception",
  "crates/senses",
  "crates/defence",
  "crates/kv-controller",
  "kernels/hosted",
  "llm-backends",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
criterion = { version = "0.5", features = ["html_reports"] }
# `default-features = false` so consumers can opt out of `std` for the
# microVM target. The default still enables `std` because every consumer
# pulls in the `derive` feature here.
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
wasmtime = { version = "43", default-features = true }
