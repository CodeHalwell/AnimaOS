name: Docker

# Cancel superseded runs on the same ref (INF-2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build and push the anima-hosted container image to GHCR.
#
# The trainer image (docker/Dockerfile.trainer) is not built here because it
# is 10–12 GB (PyTorch + CUDA + Unsloth) and cannot complete within a
# GitHub-hosted runner's time budget.  Build it locally when needed:
#   docker build -f docker/Dockerfile.trainer -t animaos/trainer:dev .
#
# This job covers the hosted agent image (~120 MB) only.
#
# Registry: ghcr.io/codehalwell/animaos/hosted
#   :main          — current tip of the main branch
#   :sha-<sha>     — immutable per-commit tag
#   :v<semver>     — published release tags (e.g. :v1.2.3, :v1.2)

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "kernels/hosted/**"
      - "llm-backends/**"
      - "console/**"
  release:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

# Read-only checkout; packages: write for GHCR push.
permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build-hosted:
    name: Build (and push) hosted image
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to actions/checkout v6.0.3 (same as ci.yml).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Enable BuildKit advanced features (cache mounts, multi-platform).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Log in to GHCR only on non-PR events so fork PRs never attempt to push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags from the triggering event:
      #   push/workflow_dispatch → :main + :sha-<short-sha>
      #   release                → :v<semver> + :v<major>.<minor> + :latest
      #   pull_request           → :pr-<number> (not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/codehalwell/animaos/hosted
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Build with GHA layer cache so the Rust compilation layer is warm on
      # subsequent runs.  The Dockerfile's BuildKit cache mounts (--mount=type=cache)
      # are separate from layer caching and are managed by BuildKit itself.
      - name: Build and push hosted image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Always keep a local copy of the image for the smoke test below,
          # even on PR events where nothing is pushed to GHCR.
          load: true

      # MVP smoke test — the containerised agent must come up against the
      # deterministic mock backend and complete one full afferent→efferent
      # round-trip: guidance in, agent wakes, mock LLM streams, AgentMessage
      # out on the SSE stream.  This is the same path exercised by
      # `docker compose -f docker-compose.mock.yml up`.
      - name: Smoke-test image (mock backend, console round-trip)
        run: |
          IMAGE=$(head -1 <<< "${{ steps.meta.outputs.tags }}")
          echo "Smoke-testing ${IMAGE}"
          # The image binds the console on 0.0.0.0 (so the published port is
          # reachable); the bind policy therefore requires a bearer token. Pass
          # one and authenticate every request — this also exercises the auth
          # path the way the image is meant to run in production.
          TOKEN=ci-smoke-token
          docker run -d --name anima-smoke \
            -e ANIMA_BACKEND=mock \
            -e ANIMA_CONSOLE_TOKEN="${TOKEN}" \
            -p 127.0.0.1:8088:8088 \
            "${IMAGE}" serve

          # Wait for the console to accept connections (≤ 30 s). /healthz is the
          # one route the token does not gate, so it doubles as the liveness probe.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8088/healthz; then break; fi
            if [ "$i" = "30" ]; then
              echo "❌ console did not come up within 30 s"
              docker logs anima-smoke; exit 1
            fi
            sleep 1
          done
          echo "✅ dashboard responds"

          # Capture the SSE stream while injecting guidance. EventSource can't set
          # headers, so /events takes the token as a query parameter.
          curl -sN --max-time 15 "http://127.0.0.1:8088/events?token=${TOKEN}" > /tmp/events.log &
          SSE_PID=$!
          sleep 1
          curl -sf -X POST http://127.0.0.1:8088/guidance \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"text":"ci smoke test","priority":"High"}'
          echo "✅ guidance accepted"
          wait $SSE_PID || true

          if grep -q '"type":"AgentMessage"' /tmp/events.log; then
            echo "✅ agent completed a mock round-trip (AgentMessage on SSE)"
          else
            echo "❌ no AgentMessage on the event stream"
            echo "--- events ---"; cat /tmp/events.log
            echo "--- container logs ---"; docker logs anima-smoke
            exit 1
          fi

          docker rm -f anima-smoke
