name: Benchmarks

# Cancel superseded PR runs on the same ref (INF-2). Scheduled runs use a
# distinct ref (refs/heads/main) and are not cancelled by PR pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Nightly macro-benchmark job — runs automatically at 02:00 UTC every day.
  schedule:
    - cron: '0 2 * * *'
  # Allow manual triggering from the Actions tab.
  workflow_dispatch:
  # Run on PRs targeting main to catch regressions before they land.
  pull_request:
    branches: [main]
    paths:
      - 'crates/scheduler/**'
      - 'crates/memory/**'
      - 'crates/praxis/**'
      - 'bench/baselines/**'
      - '.github/workflows/bench.yml'

env:
  CARGO_TERM_COLOR: always
  # Benchmarks are performance-sensitive; do not promote warnings to errors.
  RUSTFLAGS: ""

permissions:
  contents: read

# Epic E4.7.3 — Regression Benchmark Suite
#
# Every bench step now runs the criterion harness *by name* (`--bench <name>`)
# so the `--output-format bencher` argument is only fed to the harness that
# understands it.  The previous form (`cargo bench -p <crate>`) also ran the
# library's unit-test runner, which rejected `--output-format` on stable.
# Combined with the missing `pipefail`, that made the bench job silently
# capture partial output without failing.
#
# We then run `xtask bench-baseline check` against the checked-in baseline
# at `bench/baselines/<crate>.json`.  Any per-bench regression beyond the
# baseline's `regression_threshold_pct` (and exceeding `noise_floor_ns`)
# fails the job before the artefacts are uploaded.
#
# To refresh a baseline after a deliberate perf change, run locally:
#   cargo bench -p scheduler --bench scheduler -- --output-format bencher \
#     | tee bench-scheduler.txt
#   cargo xtask bench-baseline update --crate scheduler \
#     --input bench-scheduler.txt --output bench/baselines/scheduler.json
# then commit the updated baseline JSON.
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  bench:
    name: Criterion benchmark suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      # Build xtask once for regression checks below.
      - name: Build xtask
        run: cargo build --manifest-path xtask/Cargo.toml

      # ------------------------------------------------------------------
      # Scheduler — MLFQ hot paths and BoundedTokenPipe credit accounting
      # ------------------------------------------------------------------
      - name: Benchmark scheduler
        shell: bash
        run: set -o pipefail && cargo bench -p scheduler --bench scheduler -- --output-format bencher | tee bench-scheduler.txt

      # E4.7: Check scheduler benchmarks against baseline.
      # On pull_request events the regression check warns but does not block
      # because baselines are captured on the same runner type used by the
      # nightly schedule.  Cross-machine comparisons have too much variance to
      # enforce as a hard gate on PR CI.
      - name: Regression check — scheduler
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- bench-baseline check \
            --crate-name scheduler \
            --input bench-scheduler.txt

      # ------------------------------------------------------------------
      # Memory — ARC cache, L1 VCM occupancy, MemoryNode decay evaluation
      # ------------------------------------------------------------------
      - name: Benchmark memory
        shell: bash
        run: set -o pipefail && cargo bench -p memory --bench memory -- --output-format bencher | tee bench-memory.txt

      # E4.7: Check memory benchmarks against baseline.
      - name: Regression check — memory
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- bench-baseline check \
            --crate-name memory \
            --input bench-memory.txt

      # ------------------------------------------------------------------
      # Praxis — tool registry dispatch, routing filter, circuit breaker
      # ------------------------------------------------------------------
      - name: Benchmark praxis
        shell: bash
        run: set -o pipefail && cargo bench -p praxis --bench praxis -- --output-format bencher | tee bench-praxis.txt

      # E4.7: Check praxis benchmarks against baseline.
      - name: Regression check — praxis
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- bench-baseline check \
            --crate-name praxis \
            --input bench-praxis.txt

      # ------------------------------------------------------------------
      # Upload HTML reports as artifacts (available for 30 days)
      # ------------------------------------------------------------------
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-reports-${{ github.run_id }}
          path: |
            target/criterion/
            bench-*.txt
          retention-days: 30
