name: Benchmarks

on:
  # Nightly macro-benchmark job — runs automatically at 02:00 UTC every day.
  schedule:
    - cron: '0 2 * * *'
  # Allow manual triggering from the Actions tab.
  workflow_dispatch:
  # Run on PRs targeting main to catch regressions before they land.
  pull_request:
    branches: [main]
    paths:
      - 'crates/scheduler/**'
      - 'crates/memory/**'
      - 'crates/praxis/**'
      - 'bench/baselines/**'
      - '.github/workflows/bench.yml'

env:
  CARGO_TERM_COLOR: always
  # Benchmarks are performance-sensitive; do not promote warnings to errors.
  RUSTFLAGS: ""

permissions:
  contents: read

jobs:
  bench:
    name: Criterion benchmark suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      # Build xtask once for regression checks below.
      - name: Build xtask
        run: cargo build --manifest-path xtask/Cargo.toml

      # ------------------------------------------------------------------
      # Scheduler — MLFQ hot paths and BoundedTokenPipe credit accounting
      # ------------------------------------------------------------------
      - name: Benchmark scheduler
        shell: bash
        run: set -o pipefail && cargo bench -p scheduler -- --output-format bencher | tee bench-scheduler.txt

      # E4.7: Check scheduler benchmarks against baseline.
      - name: Regression check — scheduler
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- bench-baseline check \
            --crate-name scheduler \
            --input bench-scheduler.txt

      # ------------------------------------------------------------------
      # Memory — ARC cache, L1 VCM occupancy, MemoryNode decay evaluation
      # ------------------------------------------------------------------
      - name: Benchmark memory
        shell: bash
        run: set -o pipefail && cargo bench -p memory -- --output-format bencher | tee bench-memory.txt

      # E4.7: Check memory benchmarks against baseline.
      - name: Regression check — memory
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- bench-baseline check \
            --crate-name memory \
            --input bench-memory.txt

      # ------------------------------------------------------------------
      # Praxis — tool registry dispatch, routing filter, circuit breaker
      # ------------------------------------------------------------------
      - name: Benchmark praxis
        shell: bash
        run: set -o pipefail && cargo bench -p praxis -- --output-format bencher | tee bench-praxis.txt

      # E4.7: Check praxis benchmarks against baseline.
      - name: Regression check — praxis
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- bench-baseline check \
            --crate-name praxis \
            --input bench-praxis.txt

      # ------------------------------------------------------------------
      # Upload HTML reports as artifacts (available for 30 days)
      # ------------------------------------------------------------------
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-reports-${{ github.run_id }}
          path: |
            target/criterion/
            bench-*.txt
          retention-days: 30
