name: Soak

# Epic E4.7 — long-running microVM soak.
#
# This workflow is the **smoke test** for the `xtask soak` driver.  It runs
# a short, bounded soak (default 5 minutes) on every dispatch so the
# checkpoint format, manifest schema, and QEMU wiring cannot regress
# silently while the production 30-day run is in flight on an operator-
# managed host.
#
# The real 30-day soak (E4.7 exit criterion 2) is *not* run here — GitHub-
# hosted runners have a 6-hour wall-clock limit.  An operator launches the
# 30-day run manually on a dedicated box:
#
#   cargo xtask soak --hours 720 --efi anima-microvm.efi --output ~/soak-2026Q2
#
# and the resulting manifest is committed under `artifacts/soak/` as a
# durable record.

on:
  # Manual dispatch only; long jobs should not run on every push.
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Soak duration in minutes (smoke test default: 5)'
        required: false
        default: '5'
        type: string
      iteration_timeout_s:
        description: 'Per-iteration QEMU timeout in seconds'
        required: false
        default: '60'
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  smoke:
    name: microVM soak smoke (E4.7.4)
    runs-on: ubuntu-latest
    # Hard wall-clock cap — protects against runaway QEMU loops even if the
    # user requests a longer duration than the runner can sustain.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install nightly toolchain + rust-src
        run: |
          rustup toolchain install nightly --component rust-src
          rustup target add --toolchain nightly x86_64-unknown-uefi

      - name: Build microVM release image
        working-directory: kernels/microvm
        # The release profile (Epic E4.7.1) uses fat LTO + opt-level=z, which
        # roughly triples cold build time; the cache key above (microvm-*) is
        # populated by ci.yml so this step normally finds a warm target dir.
        run: cargo +nightly build --release

      - name: Resolve duration → hours
        id: dur
        run: |
          MIN="${{ github.event.inputs.duration_minutes }}"
          # Convert minutes → hours with shell arithmetic (bc would also work).
          HOURS=$(awk -v m="$MIN" 'BEGIN { printf "%.6f", m / 60.0 }')
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "Soak duration: ${MIN} min (${HOURS} h)"

      - name: Run xtask soak
        run: |
          # xtask is I/O bound on QEMU; debug profile is fine and saves
          # the cold-build cost on the runner.
          cargo run --manifest-path xtask/Cargo.toml -- soak \
            --hours "${{ steps.dur.outputs.hours }}" \
            --efi kernels/microvm/target/x86_64-unknown-uefi/release/anima-microvm.efi \
            --output artifacts/soak/ci-smoke \
            --iteration-timeout-s "${{ github.event.inputs.iteration_timeout_s }}"

      - name: Assert at least one OK iteration
        run: |
          python3 - <<'PY'
          import json, sys
          with open('artifacts/soak/ci-smoke/manifest.json') as f:
              m = json.load(f)
          summary = m.get('summary') or {}
          ok = summary.get('ok', 0)
          unscheduled = summary.get('unscheduled_exits', 0)
          timeouts = summary.get('timeouts', 0)
          print(f"smoke summary: ok={ok}  timeouts={timeouts}  unscheduled={unscheduled}")
          if ok < 1:
              print("::error::soak smoke produced zero OK iterations")
              sys.exit(1)
          if unscheduled > 0:
              print(f"::error::soak smoke recorded {unscheduled} unscheduled exits")
              sys.exit(1)
          PY

      - name: Upload soak artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-smoke-${{ github.run_id }}
          path: artifacts/soak/ci-smoke/
          retention-days: 14

  dry-run-self-test:
    # Always-on harness self-test: exercises the soak driver without QEMU so
    # the parser/manifest path is covered on every workflow run regardless of
    # whether the EFI image builds.  Cheap (<10s) and runs in parallel with
    # the live smoke job above.
    name: Soak driver dry-run self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-cargo-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-cargo-
      - name: xtask soak --efi-omitted (dry-run mode)
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- soak \
            --hours 0.001 \
            --output artifacts/soak/dry-run
      - name: Assert manifest schema present
        run: |
          test -f artifacts/soak/dry-run/manifest.json
          python3 - <<'PY'
          import json, sys
          m = json.load(open('artifacts/soak/dry-run/manifest.json'))
          for key in ('started_at', 'planned_hours', 'mode', 'iterations', 'summary'):
              if key not in m:
                  print(f"::error::manifest missing field {key!r}")
                  sys.exit(1)
          if m['mode'] != 'dry_run':
              print(f"::error::expected mode=dry_run, got {m['mode']!r}")
              sys.exit(1)
          print('manifest schema OK')
          PY
