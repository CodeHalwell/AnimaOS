name: MicroVM Soak (E4.7)

# E4.7 exit criterion 2: 30-day soak without unscheduled restart.
#
# This workflow provides two modes:
#   smoke-test  — 5-minute dry-run CI gate (no QEMU).  Runs on every PR to
#                 verify the soak harness itself is healthy.
#   full-soak   — Manual dispatch only, for the production-readiness 30-day
#                 run.  IMPORTANT: GitHub-hosted runners (ubuntu-latest) are
#                 terminated after 6 hours.  A full 8640-iteration × 5-min
#                 soak takes ~30 days, so full-soak MUST target a self-hosted
#                 runner with QEMU/OVMF and no job-time limit.  Use the
#                 `runner` input (default: self-hosted) to select the runner
#                 label.  If you need to resume a previous run, set `output`
#                 to the same artifacts directory and the harness will pick up
#                 from the last completed iteration.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '"smoke" for dry-run CI check, "full" for QEMU-backed run'
        required: false
        default: smoke
      iterations:
        description: 'Number of boot iterations (full mode only, default 8640 = 30 days @ 5-min cycle)'
        required: false
        default: '8640'
      timeout_secs:
        description: 'Per-iteration timeout in seconds (default 30)'
        required: false
        default: '30'
      interval_secs:
        description: 'Seconds to wait between iterations (default 300 = 5 min, gives 30-day cadence at 8640 iterations)'
        required: false
        default: '300'
      runner:
        description: 'Runner label for full-soak job (must be self-hosted for 30-day runs; ubuntu-latest is capped at 6 h)'
        required: false
        default: 'self-hosted'
  pull_request:
    branches: [main]
    paths:
      - 'xtask/src/soak.rs'
      - '.github/workflows/soak.yml'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  soak-smoke:
    name: Soak smoke-test (dry-run, E4.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache cargo (xtask)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-

      - name: Build xtask
        run: cargo build --manifest-path xtask/Cargo.toml

      - name: Run soak smoke-test (dry-run)
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- soak \
            --dry-run \
            --iterations 3 \
            --output artifacts/soak-smoke

      - name: Verify manifest schema
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("artifacts/soak-smoke/manifest.json") as f:
              m = json.load(f)
          assert m["completed_iterations"] == 3, f"expected 3, got {m['completed_iterations']}"
          assert m["successful_iterations"] == 3, f"expected 3, got {m['successful_iterations']}"
          assert m["timeout_iterations"] == 0
          assert m["unscheduled_exit_iterations"] == 0
          assert len(m["iterations"]) == 3
          assert all(i["outcome"] == "dry_run" for i in m["iterations"]), \
              "all iterations should be dry_run"
          print("✅ Manifest schema valid")
          EOF

      - name: Upload soak smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-smoke-manifest-${{ github.run_id }}
          path: artifacts/soak-smoke/
          retention-days: 7

  soak-full:
    name: Soak full run (QEMU, E4.7)
    # Self-hosted runner required: GitHub-hosted runners are capped at 6 hours
    # and cannot complete a 30-day soak.  Override with the `runner` input when
    # dispatching.  The soak harness is resumable — restart with the same
    # `output` directory to continue from the last completed iteration.
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --component rust-src
          rustup target add --toolchain nightly x86_64-unknown-uefi

      - name: Build microVM EFI image (release)
        working-directory: kernels/microvm
        run: cargo +nightly build --release

      - name: Cache cargo (xtask)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-

      - name: Build xtask
        run: cargo build --manifest-path xtask/Cargo.toml

      - name: Run microVM soak
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- soak \
            --efi kernels/microvm/target/x86_64-unknown-uefi/release/anima-microvm.efi \
            --iterations ${{ github.event.inputs.iterations }} \
            --timeout-secs ${{ github.event.inputs.timeout_secs }} \
            --interval-secs ${{ github.event.inputs.interval_secs }} \
            --output artifacts/soak-full

      - name: Verify soak success
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("artifacts/soak-full/manifest.json") as f:
              m = json.load(f)
          total = m["completed_iterations"]
          ok = m["successful_iterations"]
          failures = m["timeout_iterations"] + m["unscheduled_exit_iterations"]
          print(f"Completed: {total}, OK: {ok}, Failures: {failures}")
          print(f"Mean boot latency: {m['mean_boot_latency_ms']:.1f} ms")
          print(f"P95  boot latency: {m['p95_boot_latency_ms']:.1f} ms")
          if failures > 0:
              print(f"❌ {failures} iteration(s) failed")
              sys.exit(1)
          if ok < 1:
              print("❌ No successful iterations")
              sys.exit(1)
          # Boot latency is informational for QEMU+OVMF: the 2 s E4.7 target
          # applies to Firecracker / Cloud Hypervisor on real hardware, not to
          # this QEMU emulation environment.
          print(f"ℹ️  Mean boot latency: {m['mean_boot_latency_ms']:.1f} ms (informational — 2 s target is for Firecracker/Cloud Hypervisor)")
          print("✅ Soak passed all assertions")
          EOF

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-full-manifest-${{ github.run_id }}
          path: artifacts/soak-full/
          retention-days: 30
