name: Nightly Verification

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily — low-traffic window
  workflow_dispatch:       # Manual trigger for development / re-runs

# ---------------------------------------------------------------------------
# Epic E4.6 — Formal Verification Rollout
#
# Two verification jobs run on every nightly schedule (and on demand):
#
#   miri  — Runs the `corpus` test suite under Miri to detect undefined
#            behaviour in the BumpAllocator and FrameAllocator unsafe code.
#            Miri catches use-after-free, out-of-bounds accesses, and
#            integer-overflow patterns that rustc cannot detect at compile
#            time.  Exit criterion: zero Miri errors across all corpus tests.
#
#   kani  — Runs the Kani bounded model-checker against the `#[kani::proof]`
#            harnesses in:
#              crates/corpus/src/frame_allocator.rs   (4 proofs)
#              crates/scheduler/src/token_pipe.rs     (5 proofs)
#              crates/scheduler/src/mlfq.rs           (6 proofs)
#
#            Each proof harness symbolically verifies a named invariant for
#            all inputs within its stated `kani::assume` bounds.  Exit
#            criterion: all 15 declared proofs pass.
#
# Exit criteria from 07-implementation-plan.md §E4.6:
#   E4.6.1 — All declared Kani proofs pass in nightly CI.            (kani job)
#   E4.6.2 — Miri runs clean on the `corpus` test suite.             (miri job)
# ---------------------------------------------------------------------------

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Miri — undefined-behaviour detection for the `corpus` crate
  # ---------------------------------------------------------------------------
  miri:
    name: "miri — corpus test suite (E4.6 exit criterion 2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain with Miri component
        run: |
          rustup toolchain install nightly \
            --component miri,rust-src,rustfmt,clippy
          rustup override set nightly

      - name: Cache cargo registry (miri)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      # Run the full corpus test suite under Miri.
      #
      # The corpus crate is no_std and contains intentionally unsafe code
      # (BumpAllocator, FrameAllocator).  Miri verifies that:
      #   - No out-of-bounds pointer accesses occur.
      #   - No use-after-free occurs in any test path.
      #   - No integer overflow in unsafe arithmetic.
      #
      # We do not pass -Zmiri-strict-provenance because the BumpAllocator
      # legitimately uses integer-to-pointer casts (heap_start + offset) as
      # *mut u8, which require the permissive (default) provenance model.
      - name: Run corpus tests under Miri
        run: cargo +nightly miri test -p corpus

  # ---------------------------------------------------------------------------
  # Kani — bounded model-checking of corpus and scheduler proof harnesses
  # ---------------------------------------------------------------------------
  kani:
    name: "kani — corpus + scheduler formal verification (E4.6 exit criterion 1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # model-checking/kani-github-action downloads a pre-built Kani release,
      # sets up the dedicated kani toolchain, and runs `cargo kani`.
      # Pinned to @v1 (latest stable v1.x); no breaking changes within v1.
      #
      # Proof coverage:
      #   corpus / frame_allocator.rs:
      #     - allocated_never_exceeds_capacity_after_allocate
      #     - zero_sized_request_always_returns_zero_sized_request_error
      #     - sequential_allocations_produce_non_overlapping_ranges
      #     - successful_allocation_stays_within_capacity_bounds
      #
      #   scheduler / token_pipe.rs:
      #     - credits_never_exceed_capacity_after_push
      #     - credits_never_exceed_capacity_after_refund
      #     - push_succeeds_iff_n_within_available_credits
      #     - push_refund_roundtrip_restores_credits
      #     - produced_is_monotonically_non_decreasing
      #
      #   scheduler / mlfq.rs:
      #     - push_increases_len_by_exactly_one
      #     - out_of_range_level_is_clamped_to_last_tier
      #     - select_on_nonempty_agenda_returns_some
      #     - select_reduces_len_by_exactly_one
      #     - select_on_empty_agenda_returns_none
      #     - boost_all_to_high_empties_all_non_zero_tiers
      - name: Run Kani proof harnesses (corpus + scheduler)
        uses: model-checking/kani-github-action@v1
        with:
          kani-flags: >-
            --package corpus
            --package scheduler
