name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clippy
        run: rustup component add clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # -------------------------------------------------------------------------
  # Epic EX.4 — Security Posture and Threat Model
  # -------------------------------------------------------------------------
  # cargo-audit: scans Cargo.lock against the RustSec advisory database for
  #   known CVEs and security advisories.  Any finding at error-level blocks
  #   the PR.  See docs/09-threat-model.md §6 for the supply-chain policy.
  #
  # cargo-deny: enforces the licence allow-list, bans unwanted crates
  #   (openssl, git2), detects duplicate dependency versions, and restricts
  #   the allowed package registries.  Policy is in deny.toml.
  # -------------------------------------------------------------------------
  security-audit:
    name: security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # --deny=warnings promotes all advisory warnings to errors so that
        # unmaintained crates also block CI (not only active CVEs).
        run: cargo audit

  security-deny:
    name: supply-chain policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo deny
        # Checks: advisories, bans (duplicates, banned crates, wildcards),
        # licences (allow-list from deny.toml), and source registries.
        run: cargo deny check
