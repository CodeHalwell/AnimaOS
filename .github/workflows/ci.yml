name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Unsafe quarantine (docs/04 §2.1): every workspace library crate except
  # the corpus TCB must declare #![forbid(unsafe_code)] at the crate root.
  # The compiler enforces the attribute wherever it is declared; this job
  # enforces that it is declared everywhere it must be, so the audit surface
  # in crates/corpus/unsafe_audit.md stays exhaustive by construction.
  unsafe-quarantine:
    name: unsafe quarantine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Assert forbid(unsafe_code) in all non-TCB library crates
        run: |
          missing=0
          for lib in crates/*/src/lib.rs llm-backends/src/lib.rs; do
            case "$lib" in
              crates/corpus/src/lib.rs) continue ;;  # TCB: unsafe permitted, audited
            esac
            if ! grep -q '^#!\[forbid(unsafe_code)\]' "$lib"; then
              echo "::error file=${lib}::missing #![forbid(unsafe_code)] at crate root"
              missing=1
            fi
          done
          if [ "$missing" = "0" ]; then
            echo "✅ all non-TCB library crates forbid unsafe_code"
          fi
          exit "$missing"

  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install clippy
        run: rustup component add clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # -------------------------------------------------------------------------
  # Epic EX.4 — Security Posture and Threat Model
  # -------------------------------------------------------------------------
  # security-audit: scans Cargo.lock against the RustSec advisory database for
  #   known CVEs and security advisories.  Any finding at error-level blocks
  #   the PR.  See docs/09-threat-model.md §6 for the supply-chain policy.
  #
  # security-deny: enforces the licence allow-list, bans unwanted crates
  #   (openssl, git2), detects duplicate dependency versions, and restricts
  #   the allowed package registries.  Policy is in deny.toml.
  #
  # Both jobs use pre-built binaries from GitHub Marketplace actions to keep
  # CI fast (avoids compiling the tools from source on every run).
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Epic E5.8 — Kill-Shot Demonstrations
  # -------------------------------------------------------------------------
  # The xtask crate lives in its own Cargo workspace (xtask/Cargo.toml) so
  # the root workspace jobs (fmt, build-and-test, clippy) do not cover it.
  # These dedicated jobs replicate the same quality gates for xtask so that
  # formatting, lints, tests, and supply-chain policy cannot regress silently.
  # The actual demo run (which writes to artifacts/) is not executed in CI
  # because the artefact bundle is intentionally not version-controlled.
  # -------------------------------------------------------------------------
  xtask-fmt:
    name: xtask rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check xtask formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check

  xtask-build:
    name: xtask build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-cargo-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-cargo-
      - name: Build xtask
        run: cargo build --manifest-path xtask/Cargo.toml --all-targets

  xtask-clippy:
    name: xtask clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install clippy
        run: rustup component add clippy
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-cargo-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-cargo-
      - name: Run clippy on xtask
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  xtask-test:
    name: xtask test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-cargo-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-cargo-
      - name: Run xtask tests
        run: cargo test --manifest-path xtask/Cargo.toml --all-targets

  security-audit:
    name: security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # rustsec/audit-check provides a pre-built cargo-audit binary and
      # produces structured annotations on the PR diff for any advisories.
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  security-deny:
    name: supply-chain policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # EmbarkStudios/cargo-deny-action provides a pre-built cargo-deny binary.
      # Checks all four categories: advisories, bans, licenses, sources.
      # Policy is read from deny.toml at the repo root.
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
          arguments: --all-features

  # -------------------------------------------------------------------------
  # Epic EX.4 — Software Bill of Materials (CycloneDX)
  # -------------------------------------------------------------------------
  # sbom: generates a CycloneDX 1.5 SBOM for every Cargo manifest in the
  #   repo and uploads them as PR artefacts. Three SBOMs are produced:
  #     - bom.cdx.json (root workspace: crates/*, kernels/hosted, llm-backends)
  #     - xtask/bom.cdx.json
  #     - kernels/microvm/bom.cdx.json
  #
  # The SBOMs document every transitive dependency, its version, source
  # registry, and licence — the same surface that cargo-audit and cargo-deny
  # scan, but in a machine-readable format consumable by external supply-
  # chain tooling (Grype, Trivy, Dependency-Track, ...).
  #
  # cargo-cyclonedx is installed from crates.io (no GitHub Action available).
  # The binary is cached across runs via the cargo cache key.
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM (cargo-cyclonedx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Two separate caches: the cargo registry tracks Cargo.lock; the
      # cargo-cyclonedx binary is keyed on its requested version so it is
      # reused across PRs that bump Cargo.lock.
      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sbom-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sbom-registry-
      - name: Cache cargo-cyclonedx binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: ${{ runner.os }}-cargo-cyclonedx-0.5
      - name: Install cargo-cyclonedx
        run: |
          if ! command -v cargo-cyclonedx >/dev/null; then
            cargo install cargo-cyclonedx --locked --version "^0.5"
          fi
      - name: Generate root workspace SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --override-filename bom.cdx
      - name: Generate xtask SBOM
        working-directory: xtask
        run: cargo cyclonedx --format json --spec-version 1.5 --override-filename bom.cdx
      - name: Generate microvm SBOM
        # microvm uses build-std + a nightly target; cargo-cyclonedx only
        # reads Cargo.lock so the host toolchain is sufficient here.
        working-directory: kernels/microvm
        run: cargo cyclonedx --format json --spec-version 1.5 --override-filename bom.cdx
      - name: Collect SBOMs
        run: |
          mkdir -p sbom-out
          find . -maxdepth 4 -name 'bom.cdx.json' -not -path './sbom-out/*' \
            -exec cp --parents {} sbom-out/ \;
          ls -R sbom-out
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sboms
          path: sbom-out/**/bom.cdx.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # Epic E4.1 — corpus no_std Port + UEFI Boot Trampoline  ✅
  # Epic E4.2 — Embassy Runtime inside corpus               ✅
  # Epic E4.3 — smoltcp TCP/IP Stack                        ✅
  # Epic E4.4 — rustls over smoltcp (TLS 1.3 loopback)     ✅
  # -------------------------------------------------------------------------
  # microvm-build: compiles the Stage 4 UEFI kernel (kernels/microvm) for the
  #   x86_64-unknown-uefi target using nightly Rust + build-std.  This job
  #   validates:
  #     S4.1.1 — corpus is no_std-clean (it is a dependency of the UEFI binary).
  #     S4.1.2 — corpus::BumpAllocator compiles as a GlobalAlloc in a bare-metal
  #              context.
  #     S4.1.3 — The UEFI binary links and emits a valid PE32+ EFI image.
  #     S4.2.1 — embassy-executor compiles on x86_64-unknown-uefi (no arch-* feature).
  #     S4.2.2 — kernel_boot_task (async) is compiled with #[embassy_executor::task].
  #     S4.3   — smoltcp 0.11 compiles (no_std + alloc) with loopback PHY.
  #     S4.4   — TLS 1.3 (RustCrypto: p256/aes-gcm/sha2/hkdf/hmac) compiles
  #              on x86_64-unknown-uefi with software-only backends.
  #
  # microvm-boot: boots the EFI image in QEMU+OVMF and asserts E4.1–E4.4
  #   exit criteria:
  #     E4.1: "ANIMA_PANIC" — panic handler reached.
  #     E4.2: "E4.2_TASK_DONE" — Embassy async task completed and signalled via
  #           the audit channel (COM1 serial).
  #     E4.3: "E4.3_TCP_DONE" — first TCP connection over smoltcp loopback
  #           established and data exchanged.
  #     E4.4: "E4.4_TLS_DONE" — TLS 1.3 handshake and application-data
  #           exchange completed (P-256 ECDHE, AES-128-GCM, SHA-256).
  # -------------------------------------------------------------------------
  microvm-build:
    name: microVM UEFI build (S4.1.1–S4.1.3, S4.2.1–S4.2.2, S4.3, S4.4)
    runs-on: ubuntu-latest
    env:
      # The global RUSTFLAGS: "-D warnings" overrides (and silently drops) any
      # [target.x86_64-unknown-uefi].rustflags entries in .cargo/config.toml.
      # This is documented Cargo behaviour: env RUSTFLAGS takes priority over
      # config-file rustflags.  The TLS crypto crates (polyval, aes) require
      # force-soft CFG flags to suppress CLMUL/AES-NI intrinsics that LLVM
      # cannot lower for the x86_64-unknown-uefi target.  We merge -D warnings
      # with the four force-soft flags here so the config entries are not
      # needed at build time.
      #
      # sha2_force_soft is the legacy cfg for the digest-0.10-generation `sha2`
      # 0.10 pulled in transitively by p256/ecdsa.  sha2_backend="soft" is the
      # replacement cfg for the digest-0.11-generation `sha2` 0.11 used
      # directly for the TLS transcript and HKDF.  Both must be present
      # because neither generation recognises the other's flag.
      RUSTFLAGS: >-
        -D warnings
        --cfg aes_force_soft
        --cfg polyval_force_soft
        --cfg sha2_force_soft
        --cfg sha2_backend="soft"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install nightly toolchain + rust-src
        run: |
          rustup toolchain install nightly --component rust-src,rustfmt,clippy
          rustup target add --toolchain nightly x86_64-unknown-uefi
      - name: Cache cargo (microvm)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernels/microvm/target
          key: ${{ runner.os }}-microvm-${{ hashFiles('kernels/microvm/Cargo.lock', 'crates/corpus/**') }}
          restore-keys: |
            ${{ runner.os }}-microvm-
      - name: rustfmt check (microvm)
        working-directory: kernels/microvm
        run: cargo +nightly fmt -- --check
      - name: clippy (microvm)
        working-directory: kernels/microvm
        run: cargo +nightly clippy -- -D warnings
      - name: Build UEFI image (debug)
        working-directory: kernels/microvm
        run: cargo +nightly build
      - name: Build UEFI image (release)
        working-directory: kernels/microvm
        run: cargo +nightly build --release
      # E4.7: Enforce EFI image-size budgets.
      # Release ≤ 1 MiB, debug ≤ 6 MiB.  Measured after the size-optimised
      # release profile (opt-level="s", lto="fat", strip="symbols") was added
      # in E4.7; see docs/10-deployment-pathways.md "Image-size audit".
      - name: Enforce EFI image-size budgets (E4.7)
        run: |
          RELEASE_EFI=kernels/microvm/target/x86_64-unknown-uefi/release/anima-microvm.efi
          DEBUG_EFI=kernels/microvm/target/x86_64-unknown-uefi/debug/anima-microvm.efi
          RELEASE_SIZE=$(stat -c %s "$RELEASE_EFI")
          DEBUG_SIZE=$(stat -c %s "$DEBUG_EFI")
          RELEASE_MAX=$((1 * 1024 * 1024))   # 1 MiB
          DEBUG_MAX=$((6 * 1024 * 1024))     # 6 MiB
          echo "Release EFI: ${RELEASE_SIZE} bytes (budget: ${RELEASE_MAX} bytes)"
          echo "Debug   EFI: ${DEBUG_SIZE} bytes (budget: ${DEBUG_MAX} bytes)"
          if [ "$RELEASE_SIZE" -gt "$RELEASE_MAX" ]; then
            echo "❌ Release EFI exceeds 1 MiB budget (${RELEASE_SIZE} bytes)"
            exit 1
          fi
          if [ "$DEBUG_SIZE" -gt "$DEBUG_MAX" ]; then
            echo "❌ Debug EFI exceeds 6 MiB budget (${DEBUG_SIZE} bytes)"
            exit 1
          fi
          echo "✅ EFI image-size budgets satisfied"
      - name: Upload EFI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anima-microvm-efi
          path: kernels/microvm/target/x86_64-unknown-uefi/release/anima-microvm.efi
          retention-days: 14

  microvm-boot:
    name: microVM UEFI boot in QEMU (E4.1 + E4.2 + E4.3 + E4.4 exit criteria)
    runs-on: ubuntu-latest
    needs: microvm-build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      # Reuse the EFI image produced by the microvm-build job rather than
      # cold-rebuilding it here.  A second cold build added ~50 s to every
      # run and was a second failure surface — CI run #26538288288 failed
      # in this step (exit 101) despite microvm-build's identical step
      # succeeding on the same commit.  The image-size budget enforced by
      # microvm-build means the artefact is exactly what we want to test.
      - name: Download EFI artefact from microvm-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anima-microvm-efi
          path: efi-artifact
      - name: Prepare FAT ESP image
        run: |
          mkdir -p esp/EFI/BOOT
          cp efi-artifact/anima-microvm.efi esp/EFI/BOOT/BOOTX64.EFI
          ls -la esp/EFI/BOOT/
      - name: Boot in QEMU and verify E4.1 + E4.2 + E4.3 + E4.4 output
        # Strategy: the UEFI binary writes to COM1 (port 0x3F8) via x86
        # port I/O, bypassing OVMF's EFI console routing.  QEMU emulates a
        # 16550A UART at 0x3F8 and forwards all bytes to the device given
        # by -serial (here: a file).
        #
        # The Embassy task runs all phases (Embassy + smoltcp TCP + TLS 1.3)
        # then panics — we use timeout to stop QEMU after it spins in the
        # panic handler.  timeout exit code 124 (timed out) is expected.
        #
        # Memory is set to 512M: the TLS 1.3 implementation uses a 2 MiB
        # static heap plus crypto stack frames that fit comfortably in 512M.
        #
        # E4.7: QEMU wall-clock runtime is recorded for informational purposes.
        # The 2 s boot target applies to Firecracker / Cloud Hypervisor on real
        # hardware; QEMU+OVMF on a GitHub Actions runner includes full firmware
        # POST time and is not a representative measurement.
        run: |
          # Locate OVMF_CODE.fd — the path varies across Ubuntu versions.
          OVMF_CODE=$(find /usr/share/OVMF /usr/share/ovmf -name "OVMF_CODE*.fd" 2>/dev/null \
                      | sort | head -1)
          if [ -z "$OVMF_CODE" ]; then
            echo "❌ Could not find OVMF_CODE.fd — is ovmf installed?"
            exit 1
          fi
          echo "Using OVMF: $OVMF_CODE"

          # Run QEMU with boot-time measurement.
          # -serial file: captures all bytes written to COM1 (port 0x3F8).
          # -cpu qemu64,+rdrand: expose the RDRAND instruction to the guest.
          BOOT_START=$(date +%s%3N)
          timeout 120 qemu-system-x86_64 \
            -cpu qemu64,+rdrand \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_CODE}" \
            -drive format=raw,file=fat:rw:esp \
            -serial file:/tmp/qemu-serial.txt \
            -display none \
            -m 512M \
            -no-reboot \
            2>/tmp/qemu-stderr.txt || true
          BOOT_END=$(date +%s%3N)
          BOOT_MS=$((BOOT_END - BOOT_START))

          echo "=== QEMU serial output ===" && cat /tmp/qemu-serial.txt || true
          echo "=== QEMU stderr ===" && cat /tmp/qemu-stderr.txt || true
          # E4.7: Log boot-to-completion latency.  This is informational;
          # the 2 s E4.7 target applies to Firecracker / Cloud Hypervisor,
          # not to QEMU+OVMF.  QEMU on a GitHub Actions runner includes full
          # firmware POST (~15–60 s) that does not reflect bare-metal latency.
          echo "Boot-to-completion latency (QEMU+OVMF): ${BOOT_MS} ms (informational — 2 s target is for Firecracker/Cloud Hypervisor)"

          # E4.2 exit criterion: Embassy async task completed and signalled.
          grep -q "E4.2_TASK_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.2 exit criterion met: Embassy async task completed and signalled audit channel" || \
            { echo "❌ E4.2_TASK_DONE not found in serial output"; exit 1; }

          # E4.3 exit criterion: first TCP connection over smoltcp loopback.
          grep -q "E4.3_TCP_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.3 exit criterion met: first TCP connection over smoltcp loopback established" || \
            { echo "❌ E4.3_TCP_DONE not found in serial output"; exit 1; }

          # E4.4 exit criterion: TLS 1.3 handshake and app data exchange.
          grep -q "E4.4_TLS_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.4 exit criterion met: TLS 1.3 handshake and application-data exchange complete" || \
            { echo "❌ E4.4_TLS_DONE not found in serial output"; exit 1; }

          # E4.5 exit criterion: sleep-cycle soak (5 phases) complete.
          grep -q "E4.5_SOAK_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.5 exit criterion met: sleep-cycle soak completed" || \
            { echo "❌ E4.5_SOAK_DONE not found in serial output"; exit 1; }

          # E4.1 exit criterion (carried forward): panic handler reached.
          grep -q "ANIMA_PANIC" /tmp/qemu-serial.txt && \
            echo "✅ E4.1 exit criterion met: panic handler reached" || \
            { echo "❌ ANIMA_PANIC not found in serial output"; exit 1; }

          # ----------------------------------------------------------
          # E4.7.2 — boot-to-soak-complete budget.
          # ----------------------------------------------------------
          # The boot latency is logged above for information only (see the
          # "Boot-to-completion latency" line). There is no pass/fail gate on
          # it here, by design:
          #
          #   * The kernel ends in a deliberate panic that spins forever, so
          #     `timeout 120 qemu …` is always killed at the timeout — the
          #     QEMU wall-clock time is not a meaningful boot-to-soak measure.
          #   * OVMF POST on shared GitHub runners varies wildly and would gate
          #     on runner CPU allocation rather than on kernel changes.
          #
          # The real E4.7.2 production budget (2 000 ms) is asserted separately
          # on Firecracker / Cloud Hypervisor hardware (07-implementation-plan
          # exit criterion 1). A previous file-based gate here read
          # /tmp/qemu-boot-time.txt, which nothing wrote, so it failed the job
          # even when every exit-criterion marker was present.
          echo "✅ All microVM boot exit-criteria markers present (E4.2–E4.5, E6.4, ANIMA_PANIC)"
      - name: Upload QEMU serial log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-serial-log
          path: /tmp/qemu-serial.txt
          retention-days: 7
