name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clippy
        run: rustup component add clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # -------------------------------------------------------------------------
  # Epic EX.4 — Security Posture and Threat Model
  # -------------------------------------------------------------------------
  # security-audit: scans Cargo.lock against the RustSec advisory database for
  #   known CVEs and security advisories.  Any finding at error-level blocks
  #   the PR.  See docs/09-threat-model.md §6 for the supply-chain policy.
  #
  # security-deny: enforces the licence allow-list, bans unwanted crates
  #   (openssl, git2), detects duplicate dependency versions, and restricts
  #   the allowed package registries.  Policy is in deny.toml.
  #
  # Both jobs use pre-built binaries from GitHub Marketplace actions to keep
  # CI fast (avoids compiling the tools from source on every run).
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Epic E5.8 — Kill-Shot Demonstrations
  # -------------------------------------------------------------------------
  # The xtask crate lives in its own Cargo workspace (xtask/Cargo.toml) so
  # the root workspace jobs (fmt, build-and-test, clippy) do not cover it.
  # These dedicated jobs replicate the same quality gates for xtask so that
  # formatting, lints, tests, and supply-chain policy cannot regress silently.
  # The actual demo run (which writes to artifacts/) is not executed in CI
  # because the artefact bundle is intentionally not version-controlled.
  # -------------------------------------------------------------------------
  xtask-fmt:
    name: xtask rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check xtask formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check

  xtask-build:
    name: xtask build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-cargo-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-cargo-
      - name: Build xtask
        run: cargo build --manifest-path xtask/Cargo.toml --all-targets

  xtask-clippy:
    name: xtask clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clippy
        run: rustup component add clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-cargo-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-cargo-
      - name: Run clippy on xtask
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  xtask-test:
    name: xtask test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xtask/target
          key: ${{ runner.os }}-xtask-cargo-${{ hashFiles('xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-cargo-
      - name: Run xtask tests
        run: cargo test --manifest-path xtask/Cargo.toml --all-targets

  security-audit:
    name: security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustsec/audit-check provides a pre-built cargo-audit binary and
      # produces structured annotations on the PR diff for any advisories.
      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  security-deny:
    name: supply-chain policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # EmbarkStudios/cargo-deny-action provides a pre-built cargo-deny binary.
      # Checks all four categories: advisories, bans, licenses, sources.
      # Policy is read from deny.toml at the repo root.
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # -------------------------------------------------------------------------
  # Epic E4.1 — corpus no_std Port + UEFI Boot Trampoline  ✅
  # Epic E4.2 — Embassy Runtime inside corpus               ✅
  # Epic E4.3 — smoltcp TCP/IP Stack                        ✅
  # Epic E4.4 — rustls over smoltcp (TLS 1.3 loopback)     ✅
  # -------------------------------------------------------------------------
  # microvm-build: compiles the Stage 4 UEFI kernel (kernels/microvm) for the
  #   x86_64-unknown-uefi target using nightly Rust + build-std.  This job
  #   validates:
  #     S4.1.1 — corpus is no_std-clean (it is a dependency of the UEFI binary).
  #     S4.1.2 — corpus::BumpAllocator compiles as a GlobalAlloc in a bare-metal
  #              context.
  #     S4.1.3 — The UEFI binary links and emits a valid PE32+ EFI image.
  #     S4.2.1 — embassy-executor compiles on x86_64-unknown-uefi (no arch-* feature).
  #     S4.2.2 — kernel_boot_task (async) is compiled with #[embassy_executor::task].
  #     S4.3   — smoltcp 0.11 compiles (no_std + alloc) with loopback PHY.
  #     S4.4   — TLS 1.3 (RustCrypto: p256/aes-gcm/sha2/hkdf/hmac) compiles
  #              on x86_64-unknown-uefi with software-only backends.
  #
  # microvm-boot: boots the EFI image in QEMU+OVMF and asserts E4.1–E4.4
  #   exit criteria:
  #     E4.1: "ANIMA_PANIC" — panic handler reached.
  #     E4.2: "E4.2_TASK_DONE" — Embassy async task completed and signalled via
  #           the audit channel (COM1 serial).
  #     E4.3: "E4.3_TCP_DONE" — first TCP connection over smoltcp loopback
  #           established and data exchanged.
  #     E4.4: "E4.4_TLS_DONE" — TLS 1.3 handshake and application-data
  #           exchange completed (P-256 ECDHE, AES-128-GCM, SHA-256).
  # -------------------------------------------------------------------------
  microvm-build:
    name: microVM UEFI build (S4.1.1–S4.1.3, S4.2.1–S4.2.2, S4.3, S4.4)
    runs-on: ubuntu-latest
    env:
      # The global RUSTFLAGS: "-D warnings" overrides (and silently drops) any
      # [target.x86_64-unknown-uefi].rustflags entries in .cargo/config.toml.
      # This is documented Cargo behaviour: env RUSTFLAGS takes priority over
      # config-file rustflags.  The TLS crypto crates (polyval, aes) require
      # force-soft CFG flags to suppress CLMUL/AES-NI intrinsics that LLVM
      # cannot lower for the x86_64-unknown-uefi target.  We merge -D warnings
      # with the three force-soft flags here so the config entries are not
      # needed at build time.
      RUSTFLAGS: >-
        -D warnings
        --cfg aes_force_soft
        --cfg polyval_force_soft
        --cfg sha2_force_soft
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain + rust-src
        run: |
          rustup toolchain install nightly --component rust-src,rustfmt,clippy
          rustup target add --toolchain nightly x86_64-unknown-uefi
      - name: Cache cargo (microvm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernels/microvm/target
          key: ${{ runner.os }}-microvm-${{ hashFiles('kernels/microvm/Cargo.lock', 'crates/corpus/**') }}
          restore-keys: |
            ${{ runner.os }}-microvm-
      - name: rustfmt check (microvm)
        working-directory: kernels/microvm
        run: cargo +nightly fmt -- --check
      - name: clippy (microvm)
        working-directory: kernels/microvm
        run: cargo +nightly clippy -- -D warnings
      - name: Build UEFI image (debug)
        working-directory: kernels/microvm
        run: cargo +nightly build
      - name: Build UEFI image (release)
        working-directory: kernels/microvm
        run: cargo +nightly build --release
      # ----------------------------------------------------------------
      # Epic E4.7.1 — image-size budget
      # ----------------------------------------------------------------
      # The production microVM target must fit in a small EFI image so
      # Firecracker/Cloud Hypervisor can mmap it without page-cache churn
      # at boot.  Budget is 1 MiB for the release image; debug builds get
      # a 6 MiB sanity bound to catch accidental dependency bloat.
      - name: Enforce EFI image-size budget (E4.7.1)
        run: |
          REL="kernels/microvm/target/x86_64-unknown-uefi/release/anima-microvm.efi"
          DBG="kernels/microvm/target/x86_64-unknown-uefi/debug/anima-microvm.efi"
          REL_BYTES=$(stat -c%s "$REL")
          DBG_BYTES=$(stat -c%s "$DBG")
          REL_BUDGET=$((1 * 1024 * 1024))   # 1 MiB
          DBG_BUDGET=$((6 * 1024 * 1024))   # 6 MiB
          printf 'release EFI: %s bytes  (budget %s)\n' "$REL_BYTES" "$REL_BUDGET"
          printf 'debug   EFI: %s bytes  (budget %s)\n' "$DBG_BYTES" "$DBG_BUDGET"
          if [ "$REL_BYTES" -gt "$REL_BUDGET" ]; then
            echo "::error::release EFI exceeds E4.7.1 budget ($REL_BYTES > $REL_BUDGET)"
            exit 1
          fi
          if [ "$DBG_BYTES" -gt "$DBG_BUDGET" ]; then
            echo "::error::debug EFI exceeds sanity bound ($DBG_BYTES > $DBG_BUDGET)"
            exit 1
          fi
          echo "✅ E4.7.1 image-size budget met"
      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: anima-microvm-efi
          path: kernels/microvm/target/x86_64-unknown-uefi/release/anima-microvm.efi
          retention-days: 14

  microvm-boot:
    name: microVM UEFI boot in QEMU (E4.1 + E4.2 + E4.3 + E4.4 exit criteria)
    runs-on: ubuntu-latest
    needs: microvm-build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install nightly toolchain + rust-src
        run: |
          rustup toolchain install nightly --component rust-src
          rustup target add --toolchain nightly x86_64-unknown-uefi
      - name: Build UEFI image (release)
        working-directory: kernels/microvm
        run: cargo +nightly build --release
      - name: Prepare FAT ESP image
        run: |
          mkdir -p esp/EFI/BOOT
          cp kernels/microvm/target/x86_64-unknown-uefi/release/anima-microvm.efi \
             esp/EFI/BOOT/BOOTX64.EFI
      - name: Boot in QEMU and verify E4.1 + E4.2 + E4.3 + E4.4 output
        # Strategy: the UEFI binary writes to COM1 (port 0x3F8) via x86
        # port I/O, bypassing OVMF's EFI console routing.  QEMU emulates a
        # 16550A UART at 0x3F8 and forwards all bytes to the device given
        # by -serial (here: a file).
        #
        # The Embassy task runs all phases (Embassy + smoltcp TCP + TLS 1.3)
        # then panics — we use timeout to stop QEMU after it spins in the
        # panic handler.  timeout exit code 124 (timed out) is expected.
        #
        # Memory is set to 512M: the TLS 1.3 implementation uses a 2 MiB
        # static heap plus crypto stack frames that fit comfortably in 512M.
        run: |
          # Locate OVMF_CODE.fd — the path varies across Ubuntu versions.
          OVMF_CODE=$(find /usr/share/OVMF /usr/share/ovmf -name "OVMF_CODE*.fd" 2>/dev/null \
                      | sort | head -1)
          if [ -z "$OVMF_CODE" ]; then
            echo "❌ Could not find OVMF_CODE.fd — is ovmf installed?"
            exit 1
          fi
          echo "Using OVMF: $OVMF_CODE"

          # Run QEMU.  The boot task runs all phases (Embassy + smoltcp TCP +
          # TLS 1.3 + sleep-cycle soak) then panics.  120 s is ample.
          # -serial file: captures all bytes written to COM1 (port 0x3F8).
          # -cpu qemu64,+rdrand: expose the RDRAND instruction to the guest.
          #   QEMU's default qemu64 CPU model does not include RDRAND; without
          #   this flag the CPUID feature check in RdRand::is_available()
          #   returns false and run_tls_loopback_test() returns an error before
          #   writing E4.4_TLS_DONE to COM1.
          #
          # E4.7.2 — boot-time measurement.
          # We measure time-to-completion (QEMU start → last DONE marker on
          # COM1), not the full QEMU wall-clock — the kernel panics after
          # the soak completes and the panic loop is bounded only by
          # `timeout`, which would dominate the elapsed total.
          #
          # Strategy: start QEMU in the background, poll the serial log for
          # `E4.5_SOAK_DONE`, record the elapsed nanoseconds, then kill the
          # QEMU process.  If the marker never appears within 60 s we let
          # the wait fall through and the per-marker grep gates below catch
          # the actual failure mode.
          : > /tmp/qemu-serial.txt
          BOOT_START_NS=$(date +%s%N)
          qemu-system-x86_64 \
            -cpu qemu64,+rdrand \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_CODE}" \
            -drive format=raw,file=fat:rw:esp \
            -serial file:/tmp/qemu-serial.txt \
            -display none \
            -m 512M \
            -no-reboot \
            2>/tmp/qemu-stderr.txt &
          QEMU_PID=$!
          # Poll the serial log every 50 ms for up to 60 s.
          BOOT_MS=""
          for _ in $(seq 1 1200); do
            if grep -q "E4.5_SOAK_DONE" /tmp/qemu-serial.txt 2>/dev/null; then
              BOOT_END_NS=$(date +%s%N)
              BOOT_MS=$(( (BOOT_END_NS - BOOT_START_NS) / 1000000 ))
              break
            fi
            # Short-circuit on early panic — the kernel writes ANIMA_PANIC
            # before any DONE marker only if something blew up.
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              break
            fi
            sleep 0.05
          done
          # Give QEMU 30 s to drain remaining markers, then kill it so the
          # job doesn't hang on the post-soak panic loop.
          ( sleep 30 && kill "$QEMU_PID" 2>/dev/null || true ) &
          wait "$QEMU_PID" 2>/dev/null || true
          if [ -n "$BOOT_MS" ]; then
            echo "$BOOT_MS" > /tmp/qemu-boot-time.txt
            echo "Boot-to-soak-complete: ${BOOT_MS} ms (E4.7.2 budget ≤ 2000 ms)"
          else
            echo "Boot-to-soak-complete: marker not seen within 60 s — boot-time gate will be skipped; per-marker gates below will surface the real failure."
          fi

          echo "=== QEMU serial output ===" && cat /tmp/qemu-serial.txt || true
          echo "=== QEMU stderr ===" && cat /tmp/qemu-stderr.txt || true

          # E4.2 exit criterion: Embassy async task completed and signalled.
          grep -q "E4.2_TASK_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.2 exit criterion met: Embassy async task completed and signalled audit channel" || \
            { echo "❌ E4.2_TASK_DONE not found in serial output"; exit 1; }

          # E4.3 exit criterion: first TCP connection over smoltcp loopback.
          grep -q "E4.3_TCP_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.3 exit criterion met: first TCP connection over smoltcp loopback established" || \
            { echo "❌ E4.3_TCP_DONE not found in serial output"; exit 1; }

          # E4.4 exit criterion: TLS 1.3 handshake and app data exchange.
          grep -q "E4.4_TLS_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.4 exit criterion met: TLS 1.3 handshake and application-data exchange complete" || \
            { echo "❌ E4.4_TLS_DONE not found in serial output"; exit 1; }

          # E4.5 exit criterion: sleep-cycle soak (5 phases) complete.
          grep -q "E4.5_SOAK_DONE" /tmp/qemu-serial.txt && \
            echo "✅ E4.5 exit criterion met: sleep-cycle soak completed" || \
            { echo "❌ E4.5_SOAK_DONE not found in serial output"; exit 1; }

          # E4.1 exit criterion (carried forward): panic handler reached.
          grep -q "ANIMA_PANIC" /tmp/qemu-serial.txt && \
            echo "✅ E4.1 exit criterion met: panic handler reached" || \
            { echo "❌ ANIMA_PANIC not found in serial output"; exit 1; }

          # ----------------------------------------------------------
          # E4.7.2 — boot-to-soak-complete gate.
          # ----------------------------------------------------------
          # Two budgets, two purposes:
          #
          #   PRODUCTION TARGET: 2 000 ms.  This is the E4.7 exit criterion
          #     and applies to the bare-metal microVM under Firecracker or
          #     Cloud Hypervisor on production hardware.  It is asserted
          #     separately (exit criterion 1, tracked 🟡 in 07-implementation-
          #     plan.md) on a dedicated host with those VMMs installed.
          #
          #   CI CEILING: 15 000 ms.  Shared GitHub-hosted runners use the
          #     full software-emulated qemu64 CPU model with no KVM, and
          #     OVMF initialisation alone consumes several seconds on cold
          #     runners.  A 2 s gate here would gate on the runner's CPU
          #     allocation rather than on kernel changes.  15 s is high
          #     enough to absorb routine runner noise but low enough to
          #     catch a regression that doubled the boot path.
          if [ -f /tmp/qemu-boot-time.txt ]; then
            BOOT_MS=$(cat /tmp/qemu-boot-time.txt)
            PROD_BUDGET_MS=2000
            CI_BUDGET_MS=15000
            if [ "$BOOT_MS" -le "$PROD_BUDGET_MS" ]; then
              echo "✅ E4.7.2 production budget met: boot-to-soak-complete ${BOOT_MS} ms ≤ ${PROD_BUDGET_MS} ms"
            else
              echo "ℹ️  E4.7.2 production budget exceeded under QEMU+OVMF emulation (${BOOT_MS} ms > ${PROD_BUDGET_MS} ms); this is expected on shared runners — the production target is asserted separately on Firecracker/Cloud Hypervisor hardware."
            fi
            if [ "$BOOT_MS" -le "$CI_BUDGET_MS" ]; then
              echo "✅ E4.7.2 CI ceiling met: ${BOOT_MS} ms ≤ ${CI_BUDGET_MS} ms"
            else
              echo "::error::E4.7.2 CI ceiling exceeded: ${BOOT_MS} ms > ${CI_BUDGET_MS} ms — this is large enough to indicate a real regression"
              exit 1
            fi
          else
            echo "::error::E4.7.2 boot-time was not captured (E4.5_SOAK_DONE never appeared)"
            exit 1
          fi
      - name: Upload QEMU serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: /tmp/qemu-serial.txt
          retention-days: 7
