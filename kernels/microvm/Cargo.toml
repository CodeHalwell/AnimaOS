[package]
name = "anima-microvm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AnimaOS Stage 4 — microVM UEFI kernel (E4.1 trampoline → E4.5 higher-crate port)"
# This package is intentionally NOT a member of the workspace root Cargo.toml.
# It targets a bare-metal UEFI environment (x86_64-unknown-uefi) and requires
# the nightly toolchain with build-std.  Its own rust-toolchain.toml pins the
# channel so `cargo` invoked inside this directory always picks the right
# toolchain, regardless of which toolchain the rest of the workspace uses.

# -------------------------------------------------------------------------
# Standalone workspace declaration so this package can be built in isolation.
# -------------------------------------------------------------------------
[workspace]

[[bin]]
name = "anima-microvm"
path = "src/main.rs"

[dependencies]
# corpus: shared no_std substrate — FrameAllocator + BumpAllocator.
corpus = { path = "../../crates/corpus" }

# -------------------------------------------------------------------------
# Epic E4.5 — Higher crates ported to no_std (Stage 1–3 substrate)
# -------------------------------------------------------------------------
# Each crate is pulled in with `default-features = false` so the std-only
# modules (file-backed L3 archive, Unix-socket cortex bridge, etc.) are
# elided. The remaining surface area — MLFQ scheduler, ARC cache, in-memory
# L3 archive, lifecycle manager, sleep cycle — runs under `no_std + alloc`
# on top of the BumpAllocator that S4.1.2 installs.
anima-self = { path = "../../crates/self", default-features = false }
interoception = { path = "../../crates/interoception", default-features = false }
memory = { path = "../../crates/memory", default-features = false }
praxis = { path = "../../crates/praxis", default-features = false }
scheduler = { path = "../../crates/scheduler", default-features = false }
senses = { path = "../../crates/senses", default-features = false }
vita = { path = "../../crates/vita", default-features = false }

# uefi: UEFI application framework.
# Features used:
#   logger — wires `log` crate to the UEFI console (SimpleTextOutputProtocol).
#            Good for human-readable on-screen output during development.
# Deliberately excluded:
#   panic_handler   — we define our own #[panic_handler] that writes directly
#                     to COM1 (port 0x3F8) via x86 port I/O, bypassing the
#                     UEFI console.  QEMU captures COM1 via -serial file:…,
#                     so the "ANIMA_PANIC" string appears in the CI serial log.
#   global_allocator — we supply corpus::BumpAllocator as our own
#                      #[global_allocator] to demonstrate S4.1.2.
uefi = { version = "0.37", features = ["logger"] }

log = { version = "0.4", default-features = false }

# -------------------------------------------------------------------------
# Epic E4.2 — Embassy async executor
# -------------------------------------------------------------------------
# embassy-executor: bare-metal cooperative async scheduler.
#   nightly — enables nightly-only optimisations (we're already on nightly).
#   No arch-* feature is selected: on x86_64 the executor falls back to a
#   portable spin-poll loop, which is exactly what we need under UEFI where
#   there is no OS scheduler and interrupts are not wired to a wake-up
#   mechanism.
#
# embassy-futures: no_std future combinators.
#   yield_now() — single cooperative yield point, used to demonstrate that
#   the executor round-trips through its poll loop between await points.
#
# static-cell: once-initialisation wrapper that turns a static variable into
#   an &'static T at run time without unsafe code at the call site.  Used
#   to store the Embassy Executor in a static slot so it can satisfy the
#   'static lifetime requirement that executor.run() imposes.
embassy-executor = { version = "0.7", features = ["nightly"] }
embassy-futures = "0.1"
static_cell = "2"

# -------------------------------------------------------------------------
# Epic E4.3 — smoltcp TCP/IP stack
# -------------------------------------------------------------------------
# smoltcp: no_std, alloc-enabled TCP/IP implementation.
#
# Features selected (minimal set for a loopback TCP demonstration):
#   proto-ipv4    — IPv4 protocol support (address handling, routing).
#   socket-tcp    — TCP socket implementation (connect/listen/send/recv).
#   medium-ethernet — Enables the Loopback PHY device which operates at
#                  the ethernet frame level.  Required by phy::Loopback.
#   alloc         — Use alloc::Vec/VecDeque for socket buffers and the
#                  Loopback packet queue.  Requires a global allocator
#                  (supplied by corpus::BumpAllocator / S4.1.2).
#
# Features deliberately excluded:
#   std, log      — We write all output directly to COM1.
#   proto-ipv6    — Out of scope for this epic.
#   medium-ip     — We use medium-ethernet so the Loopback PHY compiles.
#
# The loopback PHY (phy::Loopback) is used to demonstrate the first TCP
# connection without real hardware.  Packets are looped through an in-
# memory VecDeque<Vec<u8>> so both sides of the connection run in the same
# poll loop — no virtio-net device is required in the CI QEMU invocation.
smoltcp = { version = "0.11", default-features = false, features = [
    "proto-ipv4",
    "socket-tcp",
    "medium-ethernet",
    "alloc",
] }

# -------------------------------------------------------------------------
# Epic E4.4 — TLS 1.3 over RustCrypto (no_std + alloc)
# -------------------------------------------------------------------------
# p256: NIST P-256 elliptic curve.
#   ecdh    — ephemeral ECDHE key exchange for TLS 1.3 key schedule.
#   ecdsa   — digital signatures for CertificateVerify message.
#
# sha2: SHA-2 family hash functions.  SHA-256 is used for the TLS 1.3
#   transcript hash and HKDF base hash.
#
# hmac: HMAC construction.  Used for the TLS 1.3 Finished MAC.
#
# hkdf: HKDF (RFC 5869) key derivation.  Implements HKDF-Extract and
#   HKDF-Expand for the TLS 1.3 key schedule (RFC 8446 §7.1).
#
# aes-gcm: AES-GCM authenticated encryption.  TLS_AES_128_GCM_SHA256
#   (cipher suite 0x1301) uses AES-128-GCM as the AEAD algorithm.
#
# rand_core: Minimal RNG traits used by p256 key generation.  The concrete
#   RNG is our RDRAND-backed RdRand struct in tls.rs.
#
# der: DER / ASN.1 parsing for loading the build-time-generated ECDSA key.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
rand_core = { version = "0.6", default-features = false }
der = { version = "0.7", default-features = false, features = ["alloc"] }

[build-dependencies]
rcgen = "0.13"

[profile.release]
opt-level = "s"
panic = "abort"

[profile.dev]
panic = "abort"
