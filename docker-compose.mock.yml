# Mock-backend standalone compose — the zero-dependency MVP.
#
# Runs the full AnimaOS organism (somatic lifecycle, sleep cycle, gate,
# router, operator console) against the deterministic mock LLM backend.
# No GPU, no model downloads, no Ollama daemon — works on any machine
# that can run Docker, in well under a minute after the image is built.
#
# Use this to evaluate the agent lifecycle and operator console, to demo
# the system, or as a CI smoke surface.  For real inference, switch to:
#   - docker-compose.yml                       (NVIDIA GPU + Ollama)
#   - docker-compose.yml + docker-compose.cpu.yml   (CPU-only Ollama)
#   - docker-compose.apple.yml                 (Apple Silicon, host Ollama)
#
# Usage:
#   docker compose -f docker-compose.mock.yml up --build
#   # The console gates every route except /healthz; this stack ships a default
#   # ANIMA_CONSOLE_TOKEN=anima-local-dev (see below), so pass it on each request:
#   # then open http://127.0.0.1:8088/?token=anima-local-dev for the dashboard, or:
#   #   anima-console tui --url http://127.0.0.1:8088 --token anima-local-dev
#   #   curl -X POST http://127.0.0.1:8088/guidance \
#   #        -H 'Authorization: Bearer anima-local-dev' \
#   #        -H 'Content-Type: application/json' \
#   #        -d '{"text":"summarise system state","priority":"High"}'
#
# One-shot subcommands:
#   docker compose -f docker-compose.mock.yml run --rm hosted why
#   docker compose -f docker-compose.mock.yml run --rm hosted doctor

services:
  hosted:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: animaos/hosted:dev
    container_name: anima-hosted
    restart: unless-stopped
    # Default: run the operator-console server.
    # Override for one-shot subcommands, e.g. `docker compose ... run --rm hosted why`.
    command: ["serve"]
    ports:
      # Operator console — bound to host loopback.
      # Open http://127.0.0.1:8088/?token=anima-local-dev in a browser for the dashboard.
      - "127.0.0.1:8088:8088"
    environment:
      # The deterministic mock backend: no network egress, reproducible streams.
      ANIMA_BACKEND: mock
      ANIMA_CONSOLE_ADDR: 0.0.0.0:8088
      # The console binds 0.0.0.0 inside the container (so the loopback port map
      # above can reach it), which the bind policy requires a token for. This
      # stack publishes only on host loopback, so a known local-dev token keeps
      # `docker compose up` working out of the box. Override it (e.g. in .env)
      # for anything beyond local development.
      ANIMA_CONSOLE_TOKEN: ${ANIMA_CONSOLE_TOKEN:-anima-local-dev}
      ANIMA_AUDIT_DIR: /home/anima/.anima/audit
    volumes:
      # Persist the identity store and audit logs across runs.
      - anima-data:/home/anima/.anima

volumes:
  anima-data:
