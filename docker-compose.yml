# AnimaOS — containerised deployment.
#
# Three services across two profiles:
#
#   ┌─────────────────┐   HTTP    ┌─────────────────┐
#   │  anima-hosted   │ ────────▶ │     ollama      │ ◀── GPU
#   │  (Rust binary)  │           │  (llama.cpp)    │
#   └─────────────────┘           └────────┬────────┘
#                                          │ shares
#                                          ▼ ollama-models volume
#                                 ┌─────────────────┐
#                                 │     trainer     │ ◀── GPU
#                                 │  (Unsloth)      │     [profile: training]
#                                 └─────────────────┘
#
# Default profile brings up `ollama` + `hosted` + a one-shot `ollama-init`
# that pre-pulls the instinct and workhorse models.  The `training` profile
# additionally builds the Unsloth trainer for sleep-phase fine-tuning.
#
# Host prereqs:
#   - Docker 23+ (BuildKit default)
#   - NVIDIA driver ≥ 550.54 (CUDA 12.4 ABI)
#   - nvidia-container-toolkit, with `nvidia` runtime registered
#
# Bring it up (inference only):
#   docker compose up --build
#
# Include the trainer:
#   docker compose --profile training up --build
#
# One-shot subcommand:
#   docker compose run --rm hosted why
#   docker compose --profile training run --rm trainer python /app/check.py

services:

  # ── Inference engine ────────────────────────────────────────────────────
  ollama:
    # Pinned for reproducible builds; bump deliberately when validating a
    # newer Ollama release.  Overridable via `OLLAMA_VERSION` in `.env`.
    # 0.30.0 has the llama.cpp engine support needed for the gemma4
    # (instinct) + qwen3_5 (workhorse) architectures used below.
    image: ollama/ollama:${OLLAMA_VERSION:-0.30.0}
    container_name: anima-ollama
    restart: unless-stopped
    ports:
      # Bind to loopback only so the daemon isn't exposed to the LAN.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep models hot for 24h between requests — avoids load-on-every-call
      # latency for the workhorse model.
      OLLAMA_KEEP_ALIVE: "24h"
      # Two slots so instinct + workhorse can be co-resident on the 3090.
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Ampere supports Flash Attention; halves KV-cache VRAM use.
      OLLAMA_FLASH_ATTENTION: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Model pre-pull (runs once, exits) ───────────────────────────────────
  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.30.0}
    container_name: anima-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: ollama:11434
      # Two-model architecture: Gemma 4 E2B instinct (~3.5 GB at Q4_K_M,
      # 2B effective params via the MatFormer activation pattern) +
      # Qwen 3.5 9B MTP workhorse (~5.5 GB at Q4_K_M, with Multi-Token
      # Prediction draft heads for speculative decoding).  Pulled straight
      # from Hugging Face via Ollama's `hf.co/...` resolver.
      ANIMA_INSTINCT_MODEL: ${ANIMA_INSTINCT_MODEL:-hf.co/unsloth/gemma-4-E2B-it-GGUF:Q4_K_M}
      ANIMA_WORKHORSE_MODEL: ${ANIMA_WORKHORSE_MODEL:-hf.co/unsloth/Qwen3.5-9B-MTP-GGUF:Q4_K_M}
    # The script must be a SINGLE command argument to `sh -c`. When `command`
    # is a bare block scalar, Compose word-splits the string into argv, so
    # `sh -c` would see only the first token (`set`) as the script and the
    # rest as positional params — pulling nothing and still exiting 0. Passing
    # it as a one-element list keeps the whole script as `-c`'s argument.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "anima-ollama-init: pulling $$ANIMA_INSTINCT_MODEL"
        ollama pull "$$ANIMA_INSTINCT_MODEL"
        echo "anima-ollama-init: pulling $$ANIMA_WORKHORSE_MODEL"
        ollama pull "$$ANIMA_WORKHORSE_MODEL"
        echo "anima-ollama-init: models ready"
    restart: "no"

  # ── Agent runtime ───────────────────────────────────────────────────────
  hosted:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: animaos/hosted:dev
    container_name: anima-hosted
    restart: unless-stopped
    # Run the operator-console server: a single long-lived agent that exposes
    # telemetry (SSE) + a guidance ingress.  The agent starts idle and is woken
    # by operator guidance.  Override for one-shot subcommands, e.g.
    #   docker compose run --rm hosted why
    command: ["serve"]
    depends_on:
      ollama:
        condition: service_healthy
      # Block startup until the one-shot model pull has finished — otherwise
      # the agent's first /api/generate can race the download and 404.
      ollama-init:
        condition: service_completed_successfully
    ports:
      # Operator console — bound to host loopback only, like the ollama daemon.
      # Open http://127.0.0.1:8088/ for the dashboard.
      - "127.0.0.1:8088:8088"
    environment:
      # `ollama` (default) / `mock` / `anthropic` / `openai`.
      ANIMA_BACKEND: ${ANIMA_BACKEND:-ollama}
      ANIMA_OLLAMA_URL: http://ollama:11434
      # Default to the workhorse model that ollama-init pulls, so overriding
      # ANIMA_WORKHORSE_MODEL alone can't leave hosted requesting a model that
      # was never pulled. An explicit ANIMA_OLLAMA_MODEL still wins.
      ANIMA_OLLAMA_MODEL: ${ANIMA_OLLAMA_MODEL:-${ANIMA_WORKHORSE_MODEL:-hf.co/unsloth/Qwen3.5-9B-MTP-GGUF:Q4_K_M}}
      ANIMA_OLLAMA_CTX: ${ANIMA_OLLAMA_CTX:-8192}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Operator console: bind all interfaces inside the container (compose maps
      # only loopback on the host).  Set ANIMA_CONSOLE_TOKEN to require a token.
      ANIMA_CONSOLE_ADDR: 0.0.0.0:8088
      ANIMA_CONSOLE_TOKEN: ${ANIMA_CONSOLE_TOKEN:-}
      ANIMA_AUDIT_DIR: /home/anima/.anima/audit
    volumes:
      # Persist the identity store + audit logs across runs.
      - anima-data:/home/anima/.anima

  # ── Sleep-phase trainer (Unsloth) ───────────────────────────────────────
  # Activated only by `docker compose --profile training up`.  Shares the
  # ollama-models volume so adapted weights round-trip back into the
  # inference engine without an explicit export step.
  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    image: animaos/trainer:dev
    container_name: anima-trainer
    profiles: ["training"]
    volumes:
      # The trainer code is baked into the image via `COPY trainer/ /app/`.
      # Do NOT bind-mount ./trainer here: it would shadow the image contents
      # and cause the root-running build context to write checkpoints back to
      # the host tree as root. Rebuild the image to pick up code changes.
      - ollama-models:/models
    environment:
      # Where Unsloth caches HF downloads / writes adapter checkpoints.
      HF_HOME: /models/hf-cache
      TRANSFORMERS_CACHE: /models/hf-cache
      # Base model for sleep-phase QLoRA.  bnb-4bit variant is the right
      # format for Unsloth's `FastLanguageModel.from_pretrained`; this is
      # the *training* sibling of the GGUF instinct model the inference
      # stack runs.  Once the sleep-phase loop exports the adapted weights
      # as GGUF, they round-trip back into Ollama via the shared volume.
      TRAINER_BASE_MODEL: ${TRAINER_BASE_MODEL:-unsloth/gemma-4-E2B-it-unsloth-bnb-4bit}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # The default CMD runs the sanity check; override to invoke training.
    # Example: `docker compose --profile training run --rm trainer python /app/sleep_phase.py`

volumes:
  anima-data:
  ollama-models:
